<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EzGov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
/* ===== Tokens (from the Figma file's saved styles and frames) ===== */
:root{
  --primary:#1b2a4a;
  --bg:#f7f6f3;
  --text:#1a1a1a;
  --muted:#525252;
  --highlight:#1638b8;

  --btn1:rgba(27,42,74,.9);
  --btn-hover:#32405d;
  --btn1-hover-border:#88909e;
  --line-soft:rgba(27,42,74,.5);

  --urgent-fill:rgba(255,39,0,.2);
  --urgent:#b81c00;
  --alert-fill:rgba(255,168,0,.3);
  --alert:#ffa800;
  --reminder-fill:rgba(22,56,184,.3);
  --info-fill:rgba(0,0,0,.08);
  --complete-fill:rgba(41,85,54,.3);
  --complete:#00ad33;
  --grey-chip-border:#525252;
  --field-ro:rgba(0,0,0,.08);
  --field-account:rgba(0,0,0,.15);

  --gutter:clamp(24px,2.5vw,48px);   /* side margin: scales with window width */
  --vs:1.15;       /* vertical spacing scale: roomier than the Figma spacing for older eyes */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--highlight);outline-offset:3px}
/* headings receive focus on page change for screen readers; no visible ring needed */
h1[tabindex="-1"]:focus,h2[tabindex="-1"]:focus{outline:none}
p{margin:0}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ===== Image slots (exported from Figma into /assets) ===== */
.asset{display:block;object-fit:contain}
.asset-missing{display:flex;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--line-soft);border-radius:8px;font-size:calc(11px*var(--ts));line-height:calc(14px*var(--ts));color:var(--muted);padding:4px;overflow:hidden;word-break:break-all}

/* ===== Header + nav ===== */
.site-header{height:140px;margin:0;padding:0 var(--gutter);display:flex;align-items:center;position:relative}
.crest{width:96px;height:96px;margin-left:0;flex:none}
.wordmark{font-weight:900;font-size:calc(64px*var(--ts));line-height:calc(42px*var(--ts));color:var(--primary);margin-left:24px;background:none;border:0;padding:0;cursor:pointer}
.wordmark:disabled{cursor:default}
.profile-btn{margin-left:0;margin-right:0;width:80px;height:80px;border:0;padding:0;background:none;border-radius:50%;cursor:pointer;flex:none}
.profile-btn > *{width:80px;height:80px}
.profile-btn.muted{width:66.667px;height:66.667px;margin-right:6.667px;cursor:default}
.profile-btn.muted > *{width:66.667px;height:66.667px}
/* Profile icon: Default and hover (Figma "Profile Icon" Variant2) */
.profile-ico{display:block;border-radius:50%;transition:box-shadow .15s}
.profile-ico .ring{stroke:#d3d3d3;transition:stroke .15s}
.profile-ico .person{stroke:var(--primary);transition:stroke .15s}
.profile-btn:not(:disabled):hover .ring,.profile-btn:not(:disabled):focus-visible .ring{stroke:var(--primary)}
.profile-btn:not(:disabled):hover .person,.profile-btn:not(:disabled):focus-visible .person{stroke:var(--highlight)}
.profile-btn:not(:disabled):hover .profile-ico{box-shadow:0 4px 8px rgba(27,42,74,.25)}
.profile-btn.muted .ring,.profile-btn.muted .person{stroke:#c4c4c4}
.site-nav{background:var(--primary);height:65px}
.site-nav ul{list-style:none;margin:0;padding:13px var(--gutter) 0;display:flex;gap:33px;height:65px}
.tab{height:52px;border:0;border-radius:20px 20px 0 0;background:transparent;cursor:pointer;font-weight:900;font-size:calc(20px*var(--ts));line-height:calc(32px*var(--ts));color:var(--bg);padding:0 30px;white-space:nowrap;min-width:156px}
.tab.wide{min-width:190px}
.tab:hover{text-decoration:underline;text-underline-offset:6px}
.tab[aria-current="page"]{background:var(--bg);color:var(--primary);text-decoration:none}
.site-nav.dim .tab:not([aria-current]){opacity:.5}

/* ===== Page shell ===== */
main{margin:0;padding:0 var(--gutter) 64px;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
.top.dash{padding-top:calc(32px*var(--vs))}           /* help box at y237 */
.top.flow{padding-top:calc(46px*var(--vs))}           /* help box at y186 (no nav) */
.top.done{padding-top:calc(32px*var(--vs))}           /* help box at y237 (nav visible) */
.top.dash .title-block{padding:calc(19px*var(--vs)) 0 0 0}
.top.flow .title-block,.top.done .title-block{padding-top:calc(27px*var(--vs))}
h1{margin:0;color:var(--primary);font-weight:900;line-height:calc(32px*var(--ts))}
.h-greet{font-size:calc(40px*var(--ts))}
.h-page{font-size:calc(36px*var(--ts))}
.h-task{font-size:calc(40px*var(--ts))}
.lede{margin:10px 0 0 0;font-size:calc(18px*var(--ts))}
h2{margin:0;color:var(--primary);font-weight:900;line-height:calc(32px*var(--ts))}
.h-sec{font-size:calc(36px*var(--ts));margin-left:0}
.h-sec40{font-size:calc(40px*var(--ts));margin-left:0}
.q{font-weight:700;font-size:calc(30px*var(--ts));line-height:calc(32px*var(--ts));color:var(--primary);margin:calc(79px*var(--vs)) 0 0;padding:5px 0}
.helper{margin:calc(18px*var(--vs)) 0 0 0;font-size:calc(18px*var(--ts))}

/* ===== Need a hand? ===== */
.help{position:relative;flex:none;z-index:5;margin-right:3px}
.help.open{z-index:50}   /* an open panel always sits above any other "Need a hand?" box */
.help-toggle{width:268px;height:78px;background:var(--bg);border:3px dashed var(--primary);border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 18px 0 21px;cursor:pointer;font-weight:600;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));color:var(--text)}
.help-toggle:hover{border:4px dashed var(--highlight);padding:0 17px 0 20px}
.help-toggle:hover .ico{color:var(--highlight)}
.help-toggle[aria-expanded="true"]{border-color:var(--highlight)}
.help-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.help-panel{position:absolute;right:0;top:calc(100% + 25px);width:424px;background:var(--bg);border:3px dashed var(--highlight);border-radius:10px;padding:20px 22px 24px 20px}
.help-group + .help-group{margin-top:52px}
.help-tag{display:inline-flex;align-items:center;justify-content:center;min-width:110px;height:39px;padding:0 12px;background:var(--reminder-fill);border:1px solid var(--highlight);border-radius:5px;font-weight:900;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));color:var(--primary)}
.help-phone{display:flex;align-items:center;gap:14px;margin-top:10px;font-size:calc(16px*var(--ts));line-height:calc(32px*var(--ts));color:var(--text)}
.help-phone .ico{color:var(--highlight)}
.help-phone a{color:var(--text)}
.help-desc{font-size:calc(16px*var(--ts));line-height:calc(32px*var(--ts));margin-top:2px}

/* Mobile "Need a hand?" bar: replaces the dropdown on phones (see mobile rules) */
.help-bar{display:none}
.m-only{display:none}

/* ===== Text size (scales page content and pop-up sheets; header, menu and help bar stay put) ===== */
:root,main,.sheet{--ts:1}
body.ts-1 main,body.ts-1 .sheet{--ts:1.15}
body.ts-2 main,body.ts-2 .sheet{--ts:1.3}
body:is(.ts-1,.ts-2) main .btn{height:auto;min-height:56px;padding-top:8px;padding-bottom:8px}
body:is(.ts-1,.ts-2) main :is(.chip,.status,.help-tag){height:auto;min-height:40px;padding-top:4px;padding-bottom:4px}
.ts{position:relative;margin-left:auto;margin-right:20px;flex:none}
.ts-btn{height:64px;display:flex;align-items:center;gap:10px;padding:0 22px 0 18px;border:3px solid #d3d3d3;border-radius:40px;background:var(--bg);cursor:pointer;color:var(--primary);font-weight:600;font-size:calc(18px*var(--ts));line-height:calc(24px*var(--ts));transition:border-color .15s,box-shadow .15s,color .15s}
.ts-glyph{font-weight:900;font-size:calc(26px*var(--ts));line-height:calc(26px*var(--ts))}
.ts-glyph small{font-size:calc(17px*var(--ts));font-weight:900}
.ts-btn:hover,.ts-btn:focus-visible,.ts-btn[aria-expanded="true"]{border-color:var(--primary);color:var(--highlight);box-shadow:0 4px 8px rgba(27,42,74,.25)}
.ts-pop{position:absolute;right:0;top:calc(100% + 12px);z-index:60;width:340px;background:var(--bg);border:3px dashed var(--highlight);border-radius:10px;padding:14px 16px 16px;box-shadow:0 10px 24px rgba(27,42,74,.18)}
.ts-pop > p{font-weight:700;font-size:calc(18px*var(--ts));line-height:calc(24px*var(--ts));color:var(--primary);margin:0 0 10px}
.ts-opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ts-opt{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:96px;padding:8px 4px 10px;border:2px solid var(--line-soft);border-radius:12px;background:var(--bg);cursor:pointer;font-weight:600;font-size:calc(15px*var(--ts));line-height:calc(18px*var(--ts));color:var(--text)}
.ts-opt span{font-weight:900;color:var(--primary);line-height:1}
.ts-opt:hover{border-color:var(--highlight);background:var(--reminder-fill)}
.ts-opt[aria-pressed="true"]{border:3px solid var(--highlight);background:var(--reminder-fill)}

/* ===== Read it to me ===== */
.qrow{display:flex;align-items:center;gap:24px;margin-top:calc(79px*var(--vs))}
.qrow .q{flex:1;margin-top:0}
.listen{flex:none;display:inline-flex;align-items:center;gap:10px;height:54px;padding:0 22px 0 16px;border:2px solid var(--highlight);border-radius:27px;background:var(--bg);color:var(--highlight);cursor:pointer;font-weight:700;font-size:calc(17px*var(--ts));line-height:calc(22px*var(--ts))}
.listen:hover{background:var(--reminder-fill)}
.listen[aria-pressed="true"]{background:var(--highlight);color:#fff}
.reading{background:rgba(22,56,184,.10);border-radius:6px;box-shadow:0 0 0 6px rgba(22,56,184,.10)}
.btns.reading{box-shadow:0 0 0 10px rgba(22,56,184,.10)}
.w-on{background:var(--highlight);color:#fff;border-radius:4px;box-shadow:0 0 0 2px var(--highlight)}

/* ===== Pop-up sheet (callback). Centred on laptop, slides up from the bottom on phones ===== */
.sheet{border:0;padding:0;background:var(--bg);color:var(--text);border-radius:20px;width:min(600px,calc(100vw - 32px));max-width:none;max-height:calc(100dvh - 48px);overflow:auto;box-shadow:0 24px 60px rgba(27,42,74,.35);font-size:calc(18px*var(--ts));line-height:calc(28px*var(--ts))}
.sheet::backdrop{background:rgba(27,42,74,.55)}
.sheet-body{padding:24px 28px 28px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:10px}
.sheet h2{font-size:calc(28px*var(--ts));line-height:calc(34px*var(--ts));margin:0;padding-top:6px}
.sheet h2:focus{outline:none}
.sheet-close{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--line-soft);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--primary);padding:0}
.sheet-close:hover{border-color:var(--highlight);color:var(--highlight);background:var(--reminder-fill)}
.sheet-close .ico{width:26px;height:26px}
.sheet p{margin:0}
.sheet .stack-btns{display:grid;gap:12px;margin-top:20px}
.sheet .btn{width:100%;min-width:0;height:auto;min-height:60px;gap:12px;text-decoration:none}
.sheet .banner{margin-top:14px;min-height:0;padding:8px 18px 12px}
.b-complete{background:var(--complete-fill);border:2px solid var(--complete)}
.opt{border:2px solid var(--line-soft);border-radius:16px;padding:14px 18px 16px;margin-top:14px}
.opt.hi{border-color:var(--highlight);background:rgba(22,56,184,.08)}
.opt h3{display:flex;align-items:center;gap:10px;margin:0;font-weight:700;font-size:calc(20px*var(--ts));line-height:calc(28px*var(--ts));color:var(--primary)}
.opt h3 .ico{color:var(--highlight)}
.opt p{margin-top:4px}
.opt .btn{margin-top:12px}
.slots{display:grid;gap:10px;margin-top:16px}
.slot{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:62px;padding:8px 18px;border:2px solid var(--line-soft);border-radius:14px;background:var(--bg);cursor:pointer;text-align:left;font-size:calc(18px*var(--ts));line-height:calc(24px*var(--ts));color:var(--text)}
.slot b{font-weight:700}
.slot:hover{border-color:var(--highlight);background:var(--reminder-fill)}
.slot[aria-pressed="true"]{border:3px solid var(--highlight);background:var(--reminder-fill);padding:7px 17px}
.slot .ico{visibility:hidden;color:var(--highlight)}
.slot[aria-pressed="true"] .ico{visibility:visible}
.badge-ok{width:64px;height:64px;border-radius:50%;background:var(--complete-fill);border:2px solid var(--complete);display:flex;align-items:center;justify-content:center;color:#006b20;margin-bottom:8px}
.cb-link{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:5px 14px 5px 10px;border:2px solid var(--highlight);border-radius:20px;background:var(--bg);color:var(--highlight);font-weight:700;font-size:calc(16px*var(--ts));line-height:calc(22px*var(--ts));cursor:pointer}
.cb-link:hover{background:var(--reminder-fill)}
.cb-link.booked{border-color:#006b20;color:#006b20;background:var(--complete-fill)}
@media (prefers-reduced-motion:reduce){.sheet[open]{animation:none!important}}

/* ===== Next payments card (Home) ===== */
.pay-card{display:flex;align-items:center;flex-wrap:wrap;gap:24px 40px;border:2px solid var(--primary);border-radius:20px;padding:20px 33px 24px;background:#fff}
.pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,260px));gap:20px 56px;flex:1 1 420px}
.pay-item{display:flex;flex-direction:column;min-width:0}
.pay-l{display:contents}
.pay-name{order:1}.pay-amt{order:2}.pay-when{order:3}.pay-note{order:4}
.pay-name{font-weight:600;font-size:calc(20px*var(--ts));line-height:calc(28px*var(--ts))}
.pay-amt{font-weight:900;font-size:calc(40px*var(--ts));line-height:calc(48px*var(--ts));color:var(--primary)}
.pay-when{font-size:calc(18px*var(--ts));line-height:calc(26px*var(--ts))}
.pay-note{margin-top:8px;align-self:flex-start;font-weight:600;font-size:calc(15px*var(--ts));line-height:calc(20px*var(--ts));padding:4px 10px;border-radius:8px;color:var(--text)}
.pay-note.warn{background:var(--alert-fill);border:1px solid var(--alert)}
.pay-note.urgent{background:var(--urgent-fill);border:1px solid var(--urgent)}
.dd-head .d b{font-weight:900;font-size:calc(24px*var(--ts));color:var(--primary)}
.dd-head .d .flag{display:inline-block;margin-left:6px;font-weight:600;font-size:calc(15px*var(--ts));line-height:calc(22px*var(--ts));padding:0 8px;border-radius:6px;background:var(--alert-fill);border:1px solid var(--alert);vertical-align:2px}

/* ===== Banners ===== */
.banner{border-radius:20px;min-height:95px;padding:14px 33px 16px;width:100%}
.banner h3{margin:0;font-weight:600;font-size:calc(20px*var(--ts));line-height:calc(32px*var(--ts));color:var(--text)}
.banner p{margin:4px 0 0;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts))}
.b-urgent{background:var(--urgent-fill);border:2px solid var(--urgent)}
.b-alert{background:var(--alert-fill);border:2px solid var(--alert)}
.b-alert-flat{background:var(--alert-fill)}
.b-info{background:var(--info-fill);border:2px solid var(--line-soft)}
.b-reminder{background:var(--reminder-fill);border:2px solid var(--highlight)}
.b-reminder-flat{background:var(--reminder-fill)}
.stack > .banner + .banner{margin-top:calc(27px*var(--vs))}

/* ===== Chips ===== */
.chip{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;height:42px;min-width:159px;padding:0 14px;font-weight:600;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));color:#000}
.c-urgent{background:var(--urgent-fill);border:2px solid var(--urgent)}
.c-alert{background:var(--alert-fill);border:2px solid var(--alert)}
.c-grey{background:var(--info-fill);border:2px solid var(--grey-chip-border)}
.status{display:inline-flex;align-items:center;height:59px;padding:0 16px 0 20px;border-radius:20px;margin-top:calc(33px*var(--vs));font-weight:600;font-size:calc(32px*var(--ts));line-height:calc(32px*var(--ts))}
.s-urgent{background:#b81c00;border:2px solid #b81c00;color:#fff}
.s-alert{background:#ffd78a;border:2px solid #c98200;color:#3d2500}
.s-complete{background:#006b20;border:2px solid #006b20;color:#fff}
.s-editing{background:var(--highlight);border:2px solid var(--highlight);color:#fff}
.row{display:flex;align-items:center;gap:24px;margin-left:0;flex-wrap:wrap}

/* ===== Progress ===== */
.progress-wrap{margin-top:calc(30px*var(--vs))}
.progress-label{display:flex;justify-content:space-between;align-items:baseline;gap:16px;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));margin-bottom:6px}
.progress-label b{font-weight:600;color:var(--primary)}
.progress-label span{color:var(--text)}
.progress{position:relative;height:59px;border-radius:10px;background:var(--reminder-fill);padding:1px;overflow:hidden}
.progress .fill{display:block;height:57px;background:var(--highlight);border-radius:8px 0 0 8px;transition:width .6s ease}
.progress .fill.full{border-radius:8px}
.progress .tick{position:absolute;top:0;bottom:0;width:3px;background:var(--bg);transform:translateX(-1.5px)}
@media (prefers-reduced-motion:reduce){.progress .fill{transition:none}}

/* ===== Buttons ===== */
.btn{height:70px;border-radius:20px;padding:0 30px;cursor:pointer;font-weight:900;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));text-align:center;display:inline-flex;align-items:center;justify-content:center;min-width:162px;flex:none}
.btn-1{background:var(--btn1);color:var(--bg);border:2px solid transparent}
.btn-1:hover{background:var(--bg);color:var(--primary);border-color:var(--btn1-hover-border)}
.btn-2{background:var(--bg);color:var(--primary);border:2px solid var(--primary)}
.btn-2:hover{background:var(--btn-hover);color:var(--bg)}
.btn-3{background:var(--bg);color:var(--primary);border:2px solid var(--line-soft)}
.btn-3:hover{background:var(--btn-hover);color:var(--bg);border-color:var(--btn-hover)}
.btn-long{width:660px;max-width:100%}
.btns{display:flex;gap:52px;flex-wrap:wrap;align-items:center}
.btns.tight{gap:27px}
.btns.edit3{gap:34px}

/* ===== Fields ===== */
.fields{margin-top:calc(34px*var(--vs))}
.field{width:660px;max-width:100%}
.field + .field{margin-top:calc(38px*var(--vs))}
.field label,.field .lbl{display:block;font-weight:600;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));padding-bottom:2px}
.input,.ro{width:100%;height:51px;border-radius:10px;border:1px solid var(--primary);padding:0 16px;font-size:calc(16px*var(--ts));line-height:calc(32px*var(--ts));color:var(--text);display:flex;align-items:center}
.input{background:#fff}
.input::placeholder{color:var(--muted);opacity:1}
.ro{background:var(--field-ro);color:var(--muted);height:auto;min-height:51px;padding-top:6px;padding-bottom:6px;overflow-wrap:anywhere}
.money{position:relative}
.money::before{content:"$";position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:calc(16px*var(--ts));pointer-events:none}
.money .input{padding-left:27px}
.err{color:var(--urgent);font-weight:600;font-size:calc(16px*var(--ts));line-height:calc(24px*var(--ts));min-height:24px;margin:11px 0 10px}
.after-fields{margin-top:calc(45px*var(--vs))}

/* ===== Reminder button component ===== */
.remind-set{color:rgba(27,42,74,.75)}
.reminder-card{width:641px;max-width:100%;min-height:95px;border:2px solid var(--line-soft);border-radius:20px;display:flex;align-items:center;gap:26px;padding:6px 22px 8px 22px;background:transparent;cursor:pointer;text-align:left}
.reminder-card:hover{background:var(--reminder-fill);border-color:var(--highlight)}
.reminder-card:hover .x{color:var(--highlight)}
.reminder-card .t{font-weight:600;font-size:calc(20px*var(--ts));line-height:calc(32px*var(--ts));display:block}
.reminder-card .d{font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));display:block}
.reminder-card .x{margin-left:auto}

/* ===== Account ===== */
.who{display:flex;align-items:center;gap:14px;margin:calc(28px*var(--vs)) 0 0 0}
.who .asset,.who .asset-missing{width:60px;height:60px}
.who h2{font-size:calc(32px*var(--ts))}
.acc-fields{margin-top:calc(16px*var(--vs))}
.acc-fields .field{width:832.5px}
.acc-fields .field + .field{margin-top:calc(30px*var(--vs))}
.acc-fields .field:nth-child(2){margin-top:calc(35px*var(--vs))}
.acc-fields .ro{background:var(--field-account)}
.acc-fields .ro.bank{border-color:var(--text);font-weight:500}
.dd{width:100%}
.dd + .dd{margin-top:calc(48px*var(--vs))}
.dd-head{width:100%;min-height:95px;border:2px solid var(--line-soft);border-radius:20px;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:2px 20px 8px 31px;cursor:pointer;text-align:left}
.dd-head:hover{background:var(--reminder-fill);border-color:var(--highlight)}
.dd-head:hover .ico{color:var(--highlight)}
.dd-head .t{display:block;font-weight:600;font-size:calc(20px*var(--ts));line-height:calc(32px*var(--ts));padding-top:4px}
.dd-head .d{display:block;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts));margin-top:4px}
.dd-head[aria-expanded="true"] .chev{transform:rotate(180deg)}
.dd-body{margin-top:14px;border:1px solid var(--highlight);border-radius:20px;background:var(--bg);padding:0 30px 26px 31px}
.dd-body h4{margin:0;font-weight:600;font-size:calc(20px*var(--ts));line-height:calc(32px*var(--ts))}
.amount{display:flex;align-items:flex-end;gap:12px;margin-top:12px}
.amount span:first-child{display:inline-flex;align-items:center;min-width:175px;height:44px;padding:0 16px;background:#fff;border:1px solid var(--primary);border-radius:20px;font-size:calc(18px*var(--ts));color:var(--muted)}
.amount span:last-child{font-size:calc(16px*var(--ts))}
.dd-body .line{font-size:calc(16px*var(--ts));line-height:calc(32px*var(--ts))}
.dd-body .line b{font-weight:500;font-size:calc(18px*var(--ts));color:var(--highlight)}
.dd-body .note{margin-top:12px;width:775px;max-width:100%;min-height:65px;padding:4px 14px 6px}

/* ===== About ===== */
.about h2{font-size:calc(36px*var(--ts));margin-left:0}
.about > p,.help-inline > p{margin:18px 0 0 0;font-size:calc(18px*var(--ts));line-height:calc(32px*var(--ts))}
.about .gap{margin-top:max(56px,calc(88px*var(--vs)))}
.help-inline{display:flex;gap:61px;align-items:flex-start}
.help-inline > p{max-width:725px}
.help-inline .help{margin-top:calc(24px*var(--vs))}
.logos{display:grid;grid-template-columns:256fr 218fr 199fr 256fr 401fr;column-gap:clamp(8px,1.5vw,24px);align-items:center;margin-top:calc(8px*var(--vs));max-width:1330px}
.logos > *{width:100%;height:auto;max-height:152px;object-fit:contain}

/* ===== Login ===== */
.login{max-width:664px;margin:0 auto;padding-bottom:64px}
.login-brand{display:flex;align-items:flex-start;justify-content:center;gap:15px;margin:-19px 0 0 55px;height:316px}
.login-brand .asset,.login-brand .asset-missing{width:316px;height:316px;flex:none}
.login-brand .wm{font-weight:900;font-size:calc(96px*var(--ts));line-height:calc(90px*var(--ts));color:var(--primary);margin:69px 0 0;width:274px}
.login h1{font-size:calc(32px*var(--ts));margin:-46px 0 0 -4px;padding:32px 0}
.login .btn-long{margin-top:calc(8px*var(--vs))}

/* ===== Laptop (e.g. 13" MacBook, ~1440 x 780 visible) =====
   Wide enough for the full layout, but short. Tighten vertical rhythm so
   every task's main button is visible without scrolling. Text sizes are kept. */
@media (min-width:901px) and (max-height:1080px){
  :root{--vs:.72}
  .site-header{height:96px}
  .crest{width:72px;height:72px}
  .wordmark{font-size:calc(52px*var(--ts));margin-left:18px}
  .profile-btn,.profile-btn > *{width:60px;height:60px}
  .profile-btn.muted,.profile-btn.muted > *{width:52px;height:52px}
  .profile-btn.muted{margin-right:4px}
  .site-nav,.site-nav ul{height:56px}
  .site-nav ul{padding-top:8px}
  .tab{height:48px}
  .h-greet,.h-task{font-size:calc(36px*var(--ts))}
  .help-toggle{height:60px}
  .ts-btn{height:56px}
  .listen{height:48px;margin:-8px 0}   /* sits beside the question without adding height */
  .help-panel{top:calc(100% + 14px);width:min(760px,calc(100vw - 2*var(--gutter)));display:grid;grid-template-columns:1fr 1fr;column-gap:32px;row-gap:44px}
  .help-group + .help-group{margin-top:0}
  .help-desc{line-height:calc(26px*var(--ts))}
  .login .btn-long{width:100%}
  .status{height:48px;font-size:calc(26px*var(--ts))}
  .top.flow .title-block,.top.done .title-block{display:flex;align-items:center;flex-wrap:wrap;gap:12px 24px}
  .top.flow .status,.top.done .status{margin-top:0}
  .top.flow{padding-top:calc(34px*var(--vs))}
  .qrow{margin-top:calc(56px*var(--vs))}
  .after-fields{margin-top:calc(36px*var(--vs))}
  .progress{height:36px}
  .progress .fill{height:34px}
  .q{font-size:calc(28px*var(--ts))}
  .btn{height:60px}
  .banner,.dd-head,.reminder-card{min-height:0}
  .pair,.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),580px));column-gap:32px;row-gap:calc(35px*var(--vs))}
  .pair .field,.fields .field{width:auto}
  .pair .field + .field,.fields .field + .field{margin-top:0}
  .btn-long{width:580px}
  .login-brand{height:240px;margin-top:0}
  .login-brand .asset,.login-brand .asset-missing{width:240px;height:240px}
  .login-brand .wm{font-size:calc(80px*var(--ts));line-height:calc(74px*var(--ts));margin-top:46px}
  .login h1{margin-top:-20px}
  .btns.after-fields{gap:32px}
  .stack.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .stack.two > .banner + .banner{margin-top:0}
}
/* Any wide screen: answers sit side by side */
@media (min-width:901px){
  .pair,.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),580px));column-gap:32px;row-gap:calc(35px*var(--vs))}
  .pair .field,.fields .field{width:auto}
  .pair .field + .field,.fields .field + .field{margin-top:0}
  .btn-long{width:580px}
  .stack.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
  .stack.two > .banner + .banner{margin-top:0}
}
/* Very short laptop screens (e.g. older 13" at 1280 x 800, ~700 visible) */
@media (min-width:901px) and (max-height:760px){
  :root{--vs:.52}
  .site-header{height:80px}
  .crest{width:60px;height:60px}
  .wordmark{font-size:calc(44px*var(--ts))}
  .profile-btn,.profile-btn > *{width:52px;height:52px}
  .profile-btn.muted,.profile-btn.muted > *{width:46px;height:46px}
  .site-nav,.site-nav ul{height:52px}
  .site-nav ul{padding-top:8px}
  .tab{height:44px}
  .h-greet,.h-task{font-size:calc(32px*var(--ts))}
  .help-toggle{height:56px}
  .ts-btn{height:50px}
  .status{height:44px;font-size:calc(24px*var(--ts))}
  .q{font-size:calc(26px*var(--ts))}
  .btn{height:56px}
  .progress{height:30px}
  .progress .fill{height:28px}
  .progress-label{margin-bottom:2px}
  .banner{padding-top:10px;padding-bottom:12px}
  .login-brand{height:200px}
  .login-brand .asset,.login-brand .asset-missing{width:200px;height:200px}
  .login-brand .wm{font-size:calc(68px*var(--ts));line-height:calc(62px*var(--ts));margin-top:40px}
}

/* ===== Small screens ===== */
@media (max-width:900px){
  :root{--gutter:16px}
  .top{flex-direction:column}
  .top .help{margin-top:16px}
  .help-panel{right:auto;left:0;width:min(424px,calc(100vw - 32px))}
  .site-nav ul{gap:6px;overflow-x:auto}
  .tab,.tab.wide{min-width:auto;padding:0 14px;font-size:calc(17px*var(--ts))}
  .wordmark{font-size:calc(44px*var(--ts))}
  .crest{width:72px;height:72px}
  .site-header{height:110px}
  .btns{gap:16px}
  .q{font-size:calc(24px*var(--ts));margin-top:48px}
  .banner{padding:8px 20px 12px}
  .reminder-card{gap:14px}
  .help-inline{flex-direction:column;gap:0}
  .logos{grid-template-columns:repeat(3,1fr);row-gap:16px}
  .login-brand{height:auto;flex-direction:column;align-items:center;margin:16px 0 0}
  .login-brand .asset,.login-brand .asset-missing{width:180px;height:180px}
  .login-brand .wm{font-size:calc(64px*var(--ts));line-height:calc(60px*var(--ts));text-align:center;margin:0;width:auto}
  .login{padding:0 16px 48px}
  .login h1{margin-top:8px}
}
@media (max-width:480px){
  .profile-btn,.profile-btn > *{width:56px;height:56px}
  .wordmark{font-size:calc(36px*var(--ts));margin-left:12px}
  .crest{width:56px;height:56px}
  .h-greet,.h-task{font-size:calc(32px*var(--ts))}
  .status{font-size:calc(24px*var(--ts));height:48px}
}

/* ===== Mobile (phones, up to 640px wide) ===== */
@keyframes sheet-up{from{transform:translateY(60px);opacity:.5}}
@media (max-width:640px){
  :root{--gutter:16px;--vs:.85}
  html{scroll-padding-top:96px}          /* focused fields never hide under the sticky help bar */
  body,main{font-size:calc(17px*var(--ts));line-height:calc(26px*var(--ts))}
  .d-only{display:none}
  .m-only{display:inline}

  /* Header + menu bar */
  .site-header{height:72px}
  .crest{width:48px;height:48px}
  .wordmark{font-size:calc(34px*var(--ts));line-height:calc(34px*var(--ts));margin-left:10px}
  .profile-btn,.profile-btn > *{width:48px;height:48px}
  .profile-btn.muted,.profile-btn.muted > *{width:42px;height:42px}
  .profile-btn.muted{margin-right:3px}
  .ts{position:static;margin-right:10px}
  .ts-btn{width:48px;height:48px;padding:0;justify-content:center;border-width:2px}
  .ts-label{display:none}
  .ts-glyph{font-size:calc(21px*var(--ts));line-height:calc(21px*var(--ts))}
  .ts-glyph small{font-size:calc(14px*var(--ts))}
  .ts-pop{left:var(--gutter);right:var(--gutter);width:auto;top:calc(100% - 8px)}
  .qrow{display:block;margin-top:22px}
  .listen{margin-top:12px;height:46px;font-size:calc(16px*var(--ts))}
  .sheet{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92dvh}
  .sheet[open]{animation:sheet-up .28s ease-out}
  .sheet-body{padding:16px 16px 24px}
  .sheet h2{font-size:calc(24px*var(--ts));line-height:calc(30px*var(--ts))}
  .site-nav,.site-nav ul{height:52px}
  .site-nav ul{padding:8px 8px 0;gap:4px;overflow:visible}
  .site-nav li{flex:1 1 auto;display:flex}
  .tab,.tab.wide{flex:1;min-width:0;height:44px;padding:0 4px;font-size:calc(15px*var(--ts));line-height:calc(20px*var(--ts));border-radius:14px 14px 0 0}

  /* "Need a hand?" becomes a sticky bar under the menu bar */
  .help{display:none}
  .help-bar{display:block;position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:2px solid var(--highlight);box-shadow:0 4px 10px rgba(27,42,74,.12);padding:6px var(--gutter) 8px}
  .help-bar-title{display:flex;align-items:center;gap:6px;margin:0;font-weight:700;font-size:calc(14px*var(--ts));line-height:calc(18px*var(--ts));color:var(--primary)}
  .help-bar-title .ico{color:var(--highlight)}
  .help-bar ul{list-style:none;margin:5px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .help-bar .hb{width:100%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:46px;padding:3px 2px;border-radius:8px;background:var(--reminder-fill);border:1px solid var(--highlight);color:var(--text);text-decoration:none;text-align:center}
  .help-bar .hb:hover,.help-bar .hb:active{background:var(--highlight);color:#fff}
  .help-bar .hb:hover .hb-t,.help-bar .hb:active .hb-t{color:#fff}
  .help-bar .hb.booked{background:var(--complete-fill);border:2px solid #006b20}
  .help-bar-title.booked{color:#006b20}
  .help-bar-title.booked .ico{color:#006b20}
  .hb-t{font-weight:900;font-size:calc(12px*var(--ts));line-height:calc(15px*var(--ts));color:var(--primary)}
  .hb-n{font-weight:700;font-size:clamp(13px,4.1vw,16px);line-height:calc(20px*var(--ts));white-space:nowrap}

  /* Page titles */
  .top.dash,.top.flow,.top.done{padding-top:20px}
  .top.dash .title-block{padding:0}
  .top.flow .title-block,.top.done .title-block{padding-top:0}
  h1{line-height:1.15}
  .h-greet,.h-task{font-size:calc(30px*var(--ts))}
  .h-page{font-size:calc(30px*var(--ts))}
  .lede{margin-top:8px;font-size:calc(17px*var(--ts));line-height:calc(26px*var(--ts))}
  h2{line-height:1.2}
  .h-sec,.h-sec40,.about h2{font-size:calc(26px*var(--ts));margin-left:0}
  .status{height:40px;font-size:calc(20px*var(--ts));padding:0 14px;border-radius:14px;margin-top:12px}
  .q{font-size:calc(22px*var(--ts));line-height:calc(30px*var(--ts));margin-top:22px;padding:0}
  .helper{font-size:calc(17px*var(--ts));line-height:calc(26px*var(--ts));margin-top:10px}

  /* Banners, chips, buttons */
  .banner{min-height:0;border-radius:16px;padding:14px 18px 16px}
  .banner h3{font-size:calc(18px*var(--ts));line-height:calc(26px*var(--ts));padding-top:2px}
  .banner p{font-size:calc(17px*var(--ts));line-height:calc(25px*var(--ts));margin-top:2px}
  .row{margin-left:0;gap:12px}
  .chip{height:40px;min-width:0;font-size:calc(16px*var(--ts))}
  .btn{height:56px;border-radius:16px;padding:0 20px}
  .btns{gap:12px!important;margin-left:0!important}
  .btns .btn{width:100%!important;min-width:0!important}
  .btn-long{width:100%}
  p[style*="margin:"]{margin-left:0!important}

  /* Progress */
  .progress-label{flex-wrap:wrap;gap:0 12px;font-size:calc(15px*var(--ts));line-height:calc(22px*var(--ts));margin-bottom:6px}
  .progress{height:28px;border-radius:8px}
  .progress .fill{height:26px;border-radius:6px 0 0 6px}
  .progress .fill.full{border-radius:6px}

  /* Fields */
  .field label,.field .lbl{font-size:calc(17px*var(--ts))}
  .err{margin:8px 0}

  /* Reminders + dropdowns */
  .reminder-card{min-height:0;gap:12px;padding:10px 14px;border-radius:16px}
  .reminder-card .ico{width:30px;height:30px}
  .reminder-card .t{font-size:calc(18px*var(--ts));line-height:calc(24px*var(--ts))}
  .reminder-card .d{font-size:calc(16px*var(--ts));line-height:calc(22px*var(--ts))}
  .dd-head{min-height:0;padding:10px 14px 12px 16px;border-radius:16px;gap:10px}
  .dd-head .ico{width:36px;height:36px}
  .dd-head .t{font-size:calc(18px*var(--ts));line-height:calc(24px*var(--ts));padding-top:0}
  .dd-head .d{font-size:calc(16px*var(--ts));line-height:calc(22px*var(--ts))}
  .dd-body{padding:0 16px 18px;border-radius:16px}
  .dd-body .line{line-height:calc(26px*var(--ts))}
  .amount span:first-child{min-width:120px}

  /* Account */
  .who{margin-top:22px}
  .pay-card{padding:16px 18px 18px;gap:18px;border-radius:16px}
  .pay-grid{grid-template-columns:1fr;gap:0;flex-basis:100%}
  .pay-item{flex-direction:row;flex-wrap:wrap;justify-content:space-between;align-items:center;column-gap:12px;padding:12px 0}
  .pay-l{display:flex;flex-direction:column;order:1}
  .pay-amt{white-space:nowrap}
  .pay-item + .pay-item{border-top:1px solid rgba(27,42,74,.2)}
  .pay-item:first-child{padding-top:0}
  .pay-item::after{content:"";flex-basis:100%;order:3}   /* note starts on its own line */
  .pay-amt{order:2}
  .pay-amt{font-size:calc(30px*var(--ts));line-height:calc(36px*var(--ts))}
  .pay-when{font-size:calc(16px*var(--ts));line-height:calc(22px*var(--ts))}
  .pay-card .btn{width:100%}
  .dd-head .d b{font-size:calc(20px*var(--ts))}
  .who .asset,.who .asset-missing{width:48px;height:48px}
  .who h2{font-size:calc(22px*var(--ts))}
  .row > div[style]{margin-left:0!important}

  /* About */
  .about > .top{display:none}
  .about > h2:first-of-type{margin-top:22px!important}
  .about > p,.help-inline > p{margin-left:0;font-size:calc(17px*var(--ts));line-height:calc(26px*var(--ts))}
  .help-inline > p{margin-top:12px!important}
  .logos{grid-template-columns:repeat(3,1fr);column-gap:14px;row-gap:12px;margin-top:16px}

  /* Log in */
  .login-brand{margin-top:24px}
  .login-brand .asset,.login-brand .asset-missing{width:140px;height:140px}
  .login-brand .wm{font-size:calc(52px*var(--ts));line-height:calc(50px*var(--ts))}
  .login h1{font-size:calc(28px*var(--ts));padding:20px 0 12px}
  .field + .field{margin-top:22px}
}

/* ===== Phone navigation: bottom tab bar with Help, slim header ===== */
.tab-ico{display:none}
.tab-help-li,.flow-help{display:none}
@media (max-width:640px){
  .site-header{height:60px}
  .crest{width:40px;height:40px}
  .wordmark{font-size:calc(30px*var(--ts));line-height:calc(30px*var(--ts))}
  .ts-btn{width:44px;height:44px}
  .profile-btn,.profile-btn > *{width:44px;height:44px}
  .profile-btn.muted,.profile-btn.muted > *{width:40px;height:40px}
  .help-bar{display:none!important}
  html{scroll-padding-top:16px;scroll-padding-bottom:96px}
  /* bottom tab bar */
  .site-nav{position:fixed;left:0;right:0;bottom:0;height:auto;z-index:45;box-shadow:0 -4px 14px rgba(27,42,74,.18);padding-bottom:env(safe-area-inset-bottom,0px)}
  .site-nav ul{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;height:auto;padding:6px}
  .site-nav li,.tab-help-li{display:block}
  .tab,.tab.wide{width:100%;height:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:0 2px;border-radius:12px;font-size:clamp(12px,3.6vw,14px);line-height:17px}
  .tab .tab-ico{display:block}
  .tab:hover{text-decoration:none}
  .tab-help{position:relative}
  .tab-help.booked::after{content:"";position:absolute;top:8px;right:calc(50% - 20px);width:12px;height:12px;border-radius:50%;background:#00ad33;border:2px solid var(--primary)}
  main{padding-bottom:110px}
  /* task screens: one help button where the tab bar would be */
  body:has(#site-nav[hidden]) .flow-help{display:block;position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--primary);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 14px rgba(27,42,74,.18)}
  .flow-help-btn{width:100%;height:56px;display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:12px;background:var(--bg);color:var(--primary);font-weight:900;font-size:16px;cursor:pointer}
  .flow-help-btn .ico{color:var(--highlight)}
  /* all help lines panel */
  .hl-num{font-weight:900;font-size:calc(28px*var(--ts));line-height:calc(34px*var(--ts));color:var(--primary);margin-top:8px!important;user-select:all}
  .hl-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .hl-btns .btn{margin-top:0;min-height:52px;padding:0 10px}
}

/* ===== Clarity pass: task cards, recent activity, receipts ===== */
.tcard{display:flex;flex-direction:column;gap:14px;border:3px solid var(--urgent);border-radius:20px;padding:18px 20px 20px;background:#fff;margin-top:calc(20px*var(--vs))}
.tcard + .tcard{margin-top:16px}
.tcard.alert{border-color:#c98200}
.tcard.calm{border-color:var(--primary)}
.tcard.locked{border:2px solid rgba(27,42,74,.35);background:transparent}
.tc-top{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.tc-flag{font-weight:800;font-size:calc(16px*var(--ts));line-height:calc(22px*var(--ts));padding:4px 10px;border-radius:8px}
.tc-flag.urgent{background:#b81c00;color:#fff}
.tc-flag.alert{background:#ffd78a;color:#3d2500}
.tc-flag.calm{background:#e4e2dc;color:#1a1a1a}

/* ===== Laptop refinements (phones unchanged) ===== */

/* ===== Laptop: completion pages and Text size button (phones unchanged) ===== */

  .stack.res > *{margin-top:0!important}

.hdr-cb,.dd-lbl{display:none}

@media (max-width:900px){.lp-only{display:none!important}}
@media (min-width:901px){
  .np-only{display:none!important}

  html{scroll-padding-top:calc(var(--hdr-s) + var(--nav-s) + 20px)}

  /* Header, menu bar and Call for help stay on screen; they slim down once you scroll */
  #view-app{padding-top:calc(var(--hdr) + var(--nav))}
  #view-app.no-nav{padding-top:var(--hdr)}
  .site-header{position:fixed;top:0;left:0;right:0;z-index:70;background:var(--bg);transition:height .2s ease,box-shadow .2s ease}
  .site-nav{position:fixed;top:var(--hdr);left:0;right:0;z-index:69;transition:top .2s ease,height .2s ease,box-shadow .2s ease}
  .site-nav ul{transition:height .2s ease,padding .2s ease}
  .tab{transition:height .2s ease}
  .crest,.profile-btn > svg,.ts-glyph{transition:width .2s ease,height .2s ease,font-size .2s ease}
  .wordmark{transition:font-size .2s ease,margin .2s ease}
  body.slim .site-header{height:var(--hdr-s)}
  body.slim .site-nav{top:var(--hdr-s);box-shadow:0 6px 14px rgba(27,42,74,.22)}
  body.slim #view-app.no-nav .site-header{box-shadow:0 6px 14px rgba(27,42,74,.18)}
  body.slim .site-nav,body.slim .site-nav ul{height:var(--nav-s)}
  body.slim .site-nav ul{padding-top:6px}
  body.slim .tab{height:calc(var(--nav-s) - 6px)}
  body.slim .crest{width:var(--s-crest);height:var(--s-crest)}
  body.slim .wordmark{font-size:var(--s-wm);line-height:var(--s-wm);margin-left:14px}
  body.slim .ts-glyph{width:var(--s-ico);height:var(--s-ico);font-size:20px;line-height:20px}
  body.slim .ts-glyph small{font-size:14px}
  body.slim .profile-btn > svg{width:var(--s-ico)!important;height:var(--s-ico)!important}
  body.slim .profile-btn.muted > svg{width:calc(var(--s-ico) - 4px)!important;height:calc(var(--s-ico) - 4px)!important}
  body.slim :is(.ts-label,.pb-label){font-size:14px!important;line-height:17px!important}

  /* Call for help moves into the bar when its box scrolls under it */
  .hdr-help{display:flex;align-items:center;margin-left:auto}
  .ts{margin-left:20px}
  .help-ph{flex:none;margin-right:3px}
  .hdr-help .help{margin:0}
  .hdr-help .help-toggle{width:auto;height:52px;gap:14px;padding:0 14px 0 16px;font-size:17px;box-shadow:0 2px 6px rgba(27,42,74,.12)}
  .hdr-help .help-toggle:hover{padding:0 13px 0 15px}
  .hdr-help .help-toggle .chev{width:26px;height:26px}
  .hdr-help .help-panel{position:fixed;top:calc(var(--hdr-s) + 10px);right:var(--gutter);max-height:calc(100vh - var(--hdr-s) - 24px);overflow:auto;box-shadow:0 12px 28px rgba(27,42,74,.22)}

  /* Callback confirmation in the header */
  .hdr-cb:not([hidden]){display:inline-flex;align-items:center;gap:10px;margin-left:36px;height:52px;padding:0 20px 0 12px;border:2px solid #006b20;border-radius:26px;background:#e2f0e5;color:var(--text);font-weight:600;font-size:17px;line-height:22px;cursor:pointer;white-space:nowrap;transition:height .2s ease,margin .2s ease}
  .hdr-cb b{font-weight:800}
  .hdr-cb .cb-dot{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:#006b20;color:#fff;flex:none}
  .hdr-cb:hover{background:#c9e4cf;text-decoration:underline;text-underline-offset:3px}
  body.slim .hdr-cb:not([hidden]){height:44px;margin-left:24px}

  /* Recent activity: Edit report button */
  .activity li:has(.act-btn){grid-template-columns:30px 1fr auto;align-items:center}
  .act-btn{grid-column:3;grid-row:1 / span 2;height:auto;min-height:52px;min-width:0;padding:6px 24px;border-radius:16px;font-size:calc(17px*var(--ts));line-height:calc(22px*var(--ts));gap:10px}
  .act-btn .ico{color:currentColor;margin:0;grid-row:auto}

  /* My Payments dropdowns: a visible label beside the arrow */
  .dd-more{gap:12px;margin-left:24px}
  .dd-lbl{display:block;font-weight:700;font-size:calc(17px*var(--ts));line-height:calc(22px*var(--ts));color:var(--highlight);text-decoration:underline;text-underline-offset:4px;white-space:nowrap}
  .dd-more .chev{width:48px;height:48px}
  .dd-head[aria-expanded="true"]{border-color:var(--highlight)}
  .acc-pay{scroll-margin-top:calc(8px - 84px*var(--vs))}   /* land with the heading text just under the bar */

  /* Reduced payment badge on Home opens an explanation */
  .pay-item{position:relative}
  .pay-why{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:inherit;padding-right:6px}
  .pay-why .chev{width:18px;height:18px;transition:transform .15s}
  .pay-why:hover{background:rgba(255,168,0,.5);text-decoration:underline;text-underline-offset:3px}
  .pay-why[aria-expanded="true"]{background:rgba(255,168,0,.5);border-color:#c98200}
  .pay-why[aria-expanded="true"] .chev{transform:rotate(180deg)}
  .why-pop{order:5;position:absolute;left:0;top:calc(100% + 10px);z-index:30;width:min(440px,calc(100vw - 2*var(--gutter)));background:#fff;border:3px dashed #c98200;border-radius:14px;padding:16px 20px 18px;box-shadow:0 12px 28px rgba(27,42,74,.2);font-size:calc(17px*var(--ts));line-height:calc(26px*var(--ts))}

/* ===== Laptop round 8: spacing, urgent cards, alert boxes, reminders, Step 3 warning, Step 4 cards (phones unchanged) ===== */
@media (min-width:901px){
  /* More breathing room everywhere */
  :root{--vs:1.35;--gutter:clamp(28px,3vw,72px)}
  .activity li{padding:18px 0}
  .tcard{padding:26px 32px 28px}
  .two-col{gap:32px}

  /* My Payments: dropdowns side by side */
  .dd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 32px;align-items:start}
  .dd-grid .dd + .dd{margin-top:0}
  .dd-grid .dd-head{height:auto;min-height:110px;align-items:center}
  .dd-grid .dd-body .note{width:auto}

  /* Urgent tasks stand out: thick red edge, tinted card, alert icon */

  .tcard.urgent .tc-flag{display:inline-flex;align-items:center;gap:8px;font-size:calc(18px*var(--ts));line-height:calc(24px*var(--ts));padding:6px 14px 6px 10px;border-radius:10px}

  .tcard.urgent .tc-date{color:#8a1500;font-weight:700}
  .tcard.urgent h3{font-size:calc(30px*var(--ts));line-height:calc(36px*var(--ts))}
  .tcard.alert{border-left:10px solid #c98200}

  /* Alert boxes on task screens: icon, coloured edge, clearer heading */
  main .banner:has(> .bn-ico){display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:18px;align-items:start;align-content:start;padding:18px 26px 20px 20px;border-radius:16px}
  main .banner:has(> .bn-ico) > :not(.bn-ico){grid-column:2}
  .bn-ico{grid-row:1 / span 2;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
  main .banner.b-reminder-flat:has(> .bn-ico){background:#eef1fb;border:2px solid #c3cdf0;border-left:8px solid var(--highlight)}
  .b-reminder-flat > .bn-ico{background:var(--highlight)}
  main .banner.b-alert-flat:has(> .bn-ico){background:#fff8e6;border:2px solid #f2cf7e;border-left:8px solid #c98200}

  .dd-body .banner.note h3{font-weight:800;color:var(--primary)}
  main .banner:has(> .bn-ico) h3{font-weight:800;color:var(--primary);line-height:calc(28px*var(--ts));padding-top:2px}
  main .banner:has(> .bn-ico) p{margin-top:2px;line-height:calc(28px*var(--ts))}

  .rem-on{display:inline-flex;align-items:center;gap:10px;padding:8px 10px;margin-top:6px;border-radius:12px;background:#e2f0e5;border:1px solid #9cc8a8;font-size:calc(16px*var(--ts));line-height:calc(22px*var(--ts));color:var(--text);max-width:100%}

  .tc-actions .rem-on{align-self:flex-end}

  .wc-arrow{color:#c98200}

  /* Step 4: payment and explanation cards */
  .res-card{border-radius:20px;padding:20px 26px 22px;min-width:0}
  .pay-res{background:#fff;border:2px solid var(--primary)}
  .pr-amt{font-weight:900;font-size:calc(44px*var(--ts));line-height:calc(52px*var(--ts));color:var(--primary);margin-top:6px}

/* ---------- Image slots: labelled placeholder until the Figma export is in /assets ---------- */
function wireAssets(root){
  root.querySelectorAll('img[data-asset]').forEach(img => {
    const swap = () => {
      const box = document.createElement('div');
      box.className = img.className.replace('asset', 'asset-missing');
      box.style.cssText = img.style.cssText;
      box.textContent = img.getAttribute('src');
      box.setAttribute('role', 'img');
      box.setAttribute('aria-label', img.alt || 'image');
      img.replaceWith(box);
    };
    if (img.complete && img.naturalWidth === 0) swap(); else img.addEventListener('error', swap, { once: true });
  });
}

// Step-based progress bar. Fills from the previous step's position to this one.
const STEPS = 4;
const STEP_NAMES = {
  report: ['Answer one question', 'Enter your income', 'Check your report', 'Done'],
  address: ['Answer one question', 'Enter your new address', 'Check your address', 'Done'],
  assets: ['Answer one question', 'Update your assets', 'Check your assets', 'Done']
};
function progress(step, task = 'report') {
  const pct = step / STEPS * 100;
  const from = S.lastProgress && S.lastProgress.task === task ? S.lastProgress.pct : 0;
  S.lastProgress = { task, pct };
  const ticks = [1, 2, 3].map(i => `<span class="tick" style="left:${i / STEPS * 100}%" aria-hidden="true"></span>`).join('');
  const label = step >= STEPS ? 'All steps complete' : `Step ${step} of ${STEPS}: ${STEP_NAMES[task][step - 1]}`;
  return `
    <div class="progress-wrap">
      <p class="progress-label"><b>${label}</b><span>${Math.round(pct)}% complete</span></p>
      <div class="progress" role="progressbar" aria-label="Task progress" aria-valuemin="0" aria-valuemax="${STEPS}" aria-valuenow="${step}" aria-valuetext="${label}">
        <span class="fill${pct >= 100 ? ' full' : ''}" style="width:${from}%" data-to="${pct}"></span>${ticks}
      </div>
    </div>`;
}

const ro = (label, value, cls = '') => `<div class="field"><span class="lbl">${label}</span><div class="ro ${cls}">${esc(value)}</div></div>`;

  const st = S.reminders[id];

    if (st) return `<div class="rem-on" data-id="${id}" role="status"><span class="rem-dot">${I.check(16)}</span><span>Reminder set. We’ll text you on <b>${REM_DAY[id.split('-')[0]]}</b>.</span><button class="rem-x" type="button" data-action="remind-off" data-id="${id}">Cancel<span class="sr-only"> reminder</span></button></div>`;
    return `<button class="tc-sub" type="button" data-action="remind" data-id="${id}">${I.bell}Text me a reminder</button>`;

      ${I.clock}<span><span class="t">Reminder set</span><span class="d">We’ll text you 24 hours before this is due.</span></span>${I.x}

}

/* ---------- Navigation ---------- */
const FLOW = ['report-1', 'report-2', 'report-3', 'address-1', 'address-2', 'address-3', 'assets-1', 'assets-2', 'assets-3'];
const DONE = ['report-4', 'address-4', 'assets-4'];
const TAB = { home: 'home', tasks: 'tasks', account: 'account', 'account-edit': 'account', about: 'about' };
const $ = s => document.querySelector(s);

const lap = () => matchMedia('(min-width:901px)').matches;   // laptop-only behaviour; phones keep their current behaviour
let payJump = false;   // set when Home's "See all payment details" opens My Account

function go(name, push = true) {
  if (push) { try { history.pushState({ screen: name }, ''); } catch (e) {} }
  stopSpeech();
  if ($('#sheet').open) $('#sheet').close();
  closeTS();
  dropPinnedHelp();
  // Laptop: payment dropdowns close whenever you leave, unless Home's button asked for them open
  if (lap() && !payJump) S.open = {};
  S.screen = name;
  const main = $('#main');
  main.innerHTML = screens[name]();
  wireAssets(main);
  const inFlow = FLOW.includes(name);
  $('#site-nav').hidden = inFlow;
  $('#view-app').classList.toggle('no-nav', inFlow);
  $('#site-nav').classList.toggle('dim', name === 'account-edit');
  const pb = $('#profile-btn');
  pb.classList.toggle('muted', inFlow);
  pb.disabled = inFlow;
  $('#wordmark').disabled = inFlow;
  document.querySelectorAll('.tab').forEach(t => {
    if (t.dataset.go === TAB[name]) t.setAttribute('aria-current', 'page'); else t.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);
  // Progress bar: fill from the previous step's position to this one
  const fill = main.querySelector('.progress .fill');
  if (fill) { void fill.offsetWidth; requestAnimationFrame(() => { fill.style.width = fill.dataset.to + '%'; }); }
  setupListen(main);
  const h = main.querySelector('h1, #q');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  onScroll();
  // From Home: jump straight to My Payments with the details already open
  if (payJump) {
    payJump = false;
    const ph = main.querySelector('.acc-pay');
    if (ph) {
      const smooth = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      requestAnimationFrame(() => {
        ph.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
        ph.setAttribute('tabindex', '-1'); ph.focus({ preventScroll: true });
      });
    }
  }
}

/* ---------- Laptop: header, menu bar and Call for help stay on screen ---------- */
let pinned = null, holder = null;
const cssPx = v => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v)) || 0;
const barBottom = () => cssPx('--hdr-s') + ($('#site-nav').hidden ? 0 : cssPx('--nav-s'));
function pinHelp(h) {
  const r = h.getBoundingClientRect(), focus = h.contains(document.activeElement);
  holder = document.createElement('div'); holder.className = 'help-ph';
  holder.style.width = r.width + 'px'; holder.style.height = r.height + 'px';
  h.replaceWith(holder); $('#hdr-help').appendChild(h); pinned = h;
  if (focus) h.querySelector('.help-toggle').focus({ preventScroll: true });
}
function unpinHelp() {
  if (!pinned) return;
  const focus = pinned.contains(document.activeElement);
  if (holder && holder.isConnected) holder.replaceWith(pinned); else pinned.remove();
  if (focus && pinned.isConnected) pinned.querySelector('.help-toggle').focus({ preventScroll: true });
  pinned = holder = null;
}
function dropPinnedHelp() { if (pinned) pinned.remove(); pinned = holder = null; }
function onScroll() {
  if ($('#view-app').hidden) return;
  if (!lap()) { document.body.classList.remove('slim'); unpinHelp(); return; }
  document.body.classList.toggle('slim', window.scrollY > 8);
}
window.addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('resize', onScroll);

/* ---------- Laptop: My Payments dropdowns and the reduced payment explanation ---------- */
function setDD(btn, open) {
  S.open[btn.dataset.id] = open;
  btn.setAttribute('aria-expanded', open);
  btn.nextElementSibling.hidden = !open;
  const l = btn.querySelector('.dd-lbl'); if (l) l.textContent = open ? 'Hide details' : 'Show details';
}
function closeDDs() { document.querySelectorAll('.dd-head[aria-expanded="true"]').forEach(b => setDD(b, false)); }
function setWhy(open) {
  const b = $('.pay-why'); if (!b) return;
  b.setAttribute('aria-expanded', open); $('#why-pop').hidden = !open;
  if (open) {   // bring the whole explanation into view if it opens below the fold
    const r = $('#why-pop').getBoundingClientRect();
    if (r.bottom > innerHeight - 16) window.scrollBy({ top: r.bottom - innerHeight + 24, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }
}

// Phone or browser Back moves back one screen inside EzGov.
// A task that has already been sent is never reopened: Back from its result goes to Home.
window.addEventListener('popstate', e => {
  const n = e.state && e.state.screen;
  if (!n || !screens[n] || $('#view-app').hidden) return;
  const sentAgain = (/^report-[123]$/.test(n) && S.income.done && S.mode !== 'edit')
    || (/^address-[123]$/.test(n) && S.address.done) || (/^assets-[123]$/.test(n) && S.assets.done);
  if (sentAgain) { try { history.replaceState({ screen: 'home' }, ''); } catch (err) {} go('home', false); return; }
  go(n, false);
});

/* ---------- Events ---------- */
const valid = v => /^\d+(\.\d{1,2})?$/.test(v);
const clean = v => v.replace(/[$,\s]/g, '');

document.addEventListener('click', e => {
  const goEl = e.target.closest('[data-go]');
  if (goEl) { go(goEl.dataset.go); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  const id = a.dataset.id;
  switch (a.dataset.action) {
    case 'help': {
      const open = a.getAttribute('aria-expanded') !== 'true';
      closeHelp();
      if (open) setHelp(a, true);
      break;
    }
    // Reminders update in place: no re-render, no scroll jump.
    case 'remind':
      if (lap()) { S.reminders[id] = 'set'; swapReminder(id); announce(`Reminder set. We’ll text you on ${REM_DAY[id.split('-')[0]]}.`); break; }
      S.reminders[id] = 'notice'; swapReminder(id);
      announce('Reminder set. We’ll text you 24 hours before this is due.');
      clearTimeout(remindTimers[id]);
      remindTimers[id] = setTimeout(() => { if (S.reminders[id] === 'notice') { S.reminders[id] = 'set'; swapReminder(id); } }, 5000);
      break;
    case 'remind-close': clearTimeout(remindTimers[id]); S.reminders[id] = 'set'; swapReminder(id); break;
    case 'remind-off': delete S.reminders[id]; swapReminder(id); announce('Reminder removed.'); break;
    case 'dd': setDD(a, !S.open[id]); break;
    case 'help-close': { const t = a.closest('.help').querySelector('.help-toggle'); closeHelp(); t.focus(); break; }
    case 'forgot': showSheet(resetForm($('#email').value.trim()), a); break;
    case 'ts-close': closeTS(); $('#ts-btn').focus(); break;
    case 'why-close': setWhy(false); $('.pay-why').focus(); break;
    case 'why-reduced': setWhy(a.getAttribute('aria-expanded') !== 'true'); break;
    case 'more-payments': {
      const open = a.getAttribute('aria-expanded') !== 'true';
      document.querySelectorAll('.ph-more').forEach(li => { li.hidden = !open; });
      a.setAttribute('aria-expanded', open);
      a.innerHTML = (open ? 'Show fewer payments' : 'Show more payments') + I.down(18);
      break;
    }
    case 'see-payments':
      if (lap()) { S.open = a.dataset.only ? { [a.dataset.only]: true } : { pension: true, carer: true }; payJump = true; }
      go('account'); break;

    // Text size
    case 'ts-toggle': { const open = a.getAttribute('aria-expanded') !== 'true'; closeHelp(); open ? openTS() : closeTS(); break; }
    case 'ts-set': setTS(+a.dataset.ts); announce('Text size: ' + a.textContent.trim()); break;
    // Read it to me
    case 'listen': speech ? stopSpeech() : startSpeech(a); break;
    // Callback
    case 'callback': {
      closeHelp();
      const i = +a.dataset.line;
      showSheet(S.callback && S.callback.line === i ? cbBooked(i) : cbChoose(i), a);
      break;
    }
    case 'cb-slots': pickedSlot = S.callback && S.callback.line === +a.dataset.line ? S.callback.slot : null; ($('#sheet').open ? renderSheet : h => showSheet(h, a))(cbSlots(+a.dataset.line)); break;
    case 'cb-pick':
      pickedSlot = +a.dataset.slot;
      document.querySelectorAll('.slot').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.slot === pickedSlot)));
      $('#slot-err').textContent = '';
      break;
    case 'cb-book': {
      if (pickedSlot == null) { $('#slot-err').textContent = 'Please choose a time first.'; return; }
      const i = +a.dataset.line;
      S.callback = { line: i, slot: pickedSlot };
      refreshHelp();
      renderSheet(cbBooked(i));
      announce(`Callback booked. The ${HELP[i][0]} team will call you ${SLOTS[pickedSlot][3]}.`);
      break;
    }
    case 'cb-cancel': {
      const i = S.callback ? S.callback.line : +a.dataset.line;
      S.callback = null; refreshHelp();
      renderSheet(cbChoose(i));
      announce('Callback cancelled.');
      break;
    }
    case 'sheet-close': $('#sheet').close(); break;
    case 'help-sheet': closeHelp(); showSheet(helpAll(), a); break;

    case 'start-report': S.lastProgress = null; S.mode = 'report'; S.draft.you = ''; S.draft.partner = ''; S.draft.noPartner = false; go('report-1'); break;
    case 'no-income': S.draft.you = '0'; S.draft.partner = '0'; S.draft.noPartner = false; go('report-3'); break;
    case 'has-income': go('report-2'); break;
    case 'cancel-income': go(S.mode === 'edit' ? 'tasks' : 'report-1'); break;
    case 'edit-income': go('report-2'); break;
    case 'cancel-edit': go('tasks'); break;
    case 'send-report':
      S.income.you = S.draft.you; S.income.partner = S.draft.partner; S.income.noPartner = S.draft.noPartner;
      S.income.edited = S.mode === 'edit'; S.income.done = true; S.receipts.income = makeReceipt();
      S.mode = 'report';   // sent: Back won't reopen it
      go('report-4'); break;
    case 'start-edit': S.lastProgress = { task: 'report', pct: 25 }; S.mode = 'edit'; S.draft.you = S.income.you; S.draft.partner = S.income.partner; S.draft.noPartner = !!S.income.noPartner; go('report-2'); break;

    case 'start-assets': S.lastProgress = null; S.draft.assets = { savings: S.assets.savings, shares: S.assets.shares, other: S.assets.other }; go('assets-1'); break;
    case 'assets-same': S.assetsMode = 'same'; go('assets-3'); break;
    case 'assets-changed': S.assetsMode = 'changed'; go('assets-2'); break;
    case 'assets-cancel': go('assets-1'); break;
    case 'assets-edit': S.assetsMode = 'changed'; go('assets-2'); break;
    case 'assets-send':
      if (S.assetsMode === 'changed') Object.assign(S.assets, S.draft.assets);
      S.assets.changed = S.assetsMode === 'changed'; S.assets.done = true; S.receipts.assets = makeReceipt();
      go('assets-4'); break;
    case 'logout': location.reload(); break;

    case 'start-address': S.lastProgress = null; S.draft.addr = ''; go('address-1'); break;
    case 'addr-moved': S.addrMode = 'moved'; go('address-2'); break;
    case 'addr-same': S.addrMode = 'same'; go('address-3'); break;
    case 'addr-cancel': go('address-1'); break;
    case 'addr-edit': S.addrMode = 'moved'; go('address-2'); break;
    case 'addr-send':
      if (S.addrMode === 'moved') { S.account.address = S.draft.addr; S.address.changed = true; } else { S.address.changed = false; }
      S.address.done = true; S.receipts.address = makeReceipt();
      go('address-4'); break;
  }
});
const remindTimers = {};
function swapReminder(id) {
  const el = document.querySelector(`[data-id="${id}"]`);
  if (!el) return;
  const hadFocus = el.contains(document.activeElement);
  const tmp = document.createElement('div');
  tmp.innerHTML = reminder(id).trim();
  const next = tmp.firstElementChild;
  el.replaceWith(next);
  if (hadFocus) (next.matches('button') ? next : next.querySelector('button') || next).focus({ preventScroll: true });
}
function announce(msg) {
  const live = $('#live');
  live.textContent = '';
  setTimeout(() => { live.textContent = msg; }, 50);
}
/* ---------- Text size ---------- */
const TS_KEY = 'ezgov-text-size';
function setTS(n, save = true) {
  document.body.classList.remove('ts-1', 'ts-2');
  if (n > 0) document.body.classList.add('ts-' + n);
  document.querySelectorAll('.ts-opt').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.ts === n)));
  if (save) { try { localStorage.setItem(TS_KEY, String(n)); } catch (e) {} }
}
function openTS() { $('#ts-btn').setAttribute('aria-expanded', 'true'); $('#ts-pop').hidden = false; }
function closeTS() { const b = $('#ts-btn'); if (b) { b.setAttribute('aria-expanded', 'false'); $('#ts-pop').hidden = true; } }

/* ---------- Read it to me (Web Speech API, highlights each word as it is spoken) ---------- */
let speech = null;
function setupListen(main) {
  const q = main.querySelector('#q');
  if (!q) return;
  const row = document.createElement('div');
  row.className = 'qrow';
  q.before(row); row.append(q);
  row.insertAdjacentHTML('beforeend', `<button class="listen" type="button" data-action="listen" aria-pressed="false">${I.speaker}<span>Read it to me</span></button>`);
}
function setListen(btn, on) {
  if (!btn || !btn.isConnected) return;
  btn.setAttribute('aria-pressed', String(on));
  btn.innerHTML = on ? `${I.stop}<span>Stop reading</span>` : `${I.speaker}<span>Read it to me</span>`;
}
// Pick the most natural-sounding English voice this device offers.
// Neural voices (Edge "Natural", Apple "Premium"/"Enhanced"/Siri, Google online voices) sound far more human
// than the basic built-in ones, and Australian English is preferred when a good one exists.
const NOVELTY = /albert|bad news|bahh|bells|boing|bubbles|cellos|deranged|good news|hysterical|jester|organ|princess|superstar|trinoids|whisper|wobble|zarvox|ralph|fred|junior|kathy|espeak/i;
let bestVoice;
function scoreVoice(v) {
  if (!/^en/i.test(v.lang) || NOVELTY.test(v.name)) return -1;
  let s = 0;
  if (/natural/i.test(v.name)) s += 100;                // Microsoft Edge neural voices
  if (/premium/i.test(v.name)) s += 90;                 // Apple downloaded premium voices
  if (/siri/i.test(v.name)) s += 80;
  if (/enhanced/i.test(v.name)) s += 70;
  if (/online/i.test(v.name)) s += 40;
  if (/^google/i.test(v.name)) s += 35;                 // Chrome's network voices
  if (/karen|catherine|lee|natasha|william/i.test(v.name)) s += 15;   // Australian voices
  if (!v.localService) s += 10;
  s += /en[-_]AU/i.test(v.lang) ? 50 : /en[-_]GB/i.test(v.lang) ? 25 : /en[-_](US|NZ|IE)/i.test(v.lang) ? 15 : 5;
  return s;
}
function pickVoice() {
  if (bestVoice) return bestVoice;
  const ranked = speechSynthesis.getVoices().map(v => [scoreVoice(v), v]).filter(([s]) => s >= 0).sort((a, b) => b[0] - a[0]);
  if (ranked.length) bestVoice = ranked[0][1];
  return bestVoice || null;
}
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();   // voices load in the background; re-pick once they arrive
  speechSynthesis.addEventListener?.('voiceschanged', () => { bestVoice = null; pickVoice(); });
}
function wrapWords(el) {
  const text = el.textContent; el.dataset.orig = text;
  let i = 0;
  el.innerHTML = text.split(/(\s+)/).map(t => { const start = i; i += t.length; return /^\s*$/.test(t) ? t : `<span class="w" data-s="${start}">${esc(t)}</span>`; }).join('');
}
function unwrap(el) {
  el.classList.remove('reading');
  if (el.dataset.orig != null) { el.textContent = el.dataset.orig; delete el.dataset.orig; }
}
function markWord(el, at) {
  let hit = null;
  el.querySelectorAll('.w').forEach(w => { w.classList.remove('w-on'); if (+w.dataset.s <= at) hit = w; });
  if (hit) hit.classList.add('w-on');
}
function startSpeech(btn) {
  if (!('speechSynthesis' in window)) { announce('Sorry, reading aloud isn’t available in this browser.'); return; }
  stopSpeech();
  const main = $('#main'), q = main.querySelector('#q');
  const after = el => q.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING;
  const items = [{ el: q, text: q.textContent, words: true }];
  main.querySelectorAll('.helper, .banner h3, .banner p').forEach(el => { if (after(el)) items.push({ el, text: el.textContent, words: true }); });
  const choices = [...main.querySelectorAll('.btns')].find(after);
  if (choices) {
    const labels = [...choices.querySelectorAll('.btn')].map(b => b.textContent.trim());
    if (labels.length > 1) items.push({ el: choices, text: `Your choices are: ${labels.slice(0, -1).join(', ')}, or ${labels[labels.length - 1]}.`, words: false });
  }
  speech = { items, i: 0, btn, cancelled: false, keep: [] };
  setListen(btn, true);
  speechSynthesis.cancel();
  speakNext();
}
function speakNext() {
  const sp = speech;
  if (!sp || sp.cancelled) return;
  if (sp.i >= sp.items.length) { stopSpeech(); return; }
  const it = sp.items[sp.i];
  it.el.classList.add('reading');
  if (it.words) wrapWords(it.el);
  it.el.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  const u = new SpeechSynthesisUtterance(it.text);
  const v = pickVoice();
  if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-AU';
  u.rate = v && /natural|premium|siri|enhanced/i.test(v.name) ? 0.95 : 0.9;   // neural voices sound best close to normal pace
  u.pitch = 1;
  u.onboundary = e => { if (sp.cancelled || !it.words || (e.name && e.name !== 'word')) return; markWord(it.el, e.charIndex); };
  u.onend = u.onerror = () => { if (sp.cancelled || speech !== sp) return; unwrap(it.el); sp.i++; speakNext(); };
  sp.keep.push(u);   // keep a reference so the browser doesn't drop the utterance mid-sentence
  speechSynthesis.speak(u);
}
function stopSpeech() {
  const sp = speech;
  if (!sp) return;
  sp.cancelled = true; speech = null;
  try { speechSynthesis.cancel(); } catch (e) {}
  sp.items.forEach(it => unwrap(it.el));
  setListen(sp.btn, false);
}

/* ---------- Pop-up sheet ---------- */
let sheetOpener = null, pickedSlot = null;
const sheetHead = (title, back = '') => `
  ${back}
  <div class="sheet-head"><h2 id="sheet-title" tabindex="-1">${title}</h2>
  <button class="sheet-close" type="button" data-action="sheet-close" aria-label="Close">${I.x}</button></div>`;
function showSheet(html, opener) {
  sheetOpener = opener || document.activeElement;
  const d = $('#sheet');
  $('#sheet-body').innerHTML = html;
  if (!d.open) d.showModal();
  $('#sheet-title').focus();
}
function renderSheet(html) {
  $('#sheet-body').innerHTML = html;
  $('#sheet').scrollTop = 0;
  $('#sheet-title').focus();
}
$('#sheet').addEventListener('close', () => {
  let back = sheetOpener;
  if (back && !back.isConnected && back.dataset && back.dataset.line != null) {
    back = [...document.querySelectorAll(`[data-action="callback"][data-line="${back.dataset.line}"]`)].find(b => b.offsetParent);
  }
  // Opened from the "Need a hand?" dropdown (now closed): return to its toggle
  if (back && back.isConnected && !back.offsetParent) back = back.closest('.help')?.querySelector('.help-toggle');
  if (back && back.isConnected && back.offsetParent) back.focus({ preventScroll: true });
});
// Tapping the dark backdrop closes the sheet
$('#sheet').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });

/* ---------- Request a callback ---------- */
function helpAll() {
  const cb = S.callback;
  return `${sheetHead('Need a hand?')}
    <p>Call one of these numbers, or ask us to call you back so you don’t wait on hold.</p>
    ${cb ? `<div class="banner b-complete"><h3>Callback booked</h3><p>The ${HELP[cb.line][0]} team will call you ${SLOTS[cb.slot][3]}.</p></div>` : ''}
    ${HELP.map(([t, n, tel, d], i) => `
      <div class="opt">
        <span class="help-tag">${t}</span>
        <p class="hl-num">${n}</p>
        <p>${d}</p>
        <div class="hl-btns">
          <a class="btn btn-2" href="tel:${tel}">${I.phoneS(20)}Call</a>
          <button class="btn btn-1" type="button" data-action="${cb && cb.line === i ? 'callback' : 'cb-slots'}" data-line="${i}">${cb && cb.line === i ? 'View callback' : 'Call me back'}</button>
        </div>
      </div>`).join('')}`;
}
function refreshHelp() {
  const fb = document.getElementById('flow-help-btn');
  if (fb) fb.innerHTML = S.callback ? `${I.check(22)}<span>Callback booked · See help lines</span>` : `${I.phoneS(22)}<span>Need a hand? See help lines</span>`;
  const th = document.getElementById('tab-help');
  if (th) th.classList.toggle('booked', !!S.callback);
  const hhb = document.getElementById('hh-btn'); if (hhb) hhb.classList.toggle('booked', !!S.callback);
  const hc = $('#hdr-cb'), cb = S.callback;
  hc.hidden = !cb;
  if (cb) {
    const [day, , short, long] = SLOTS[cb.slot];
    hc.dataset.line = cb.line;
    hc.setAttribute('aria-label', `Callback booked. The ${HELP[cb.line][0]} team will call you ${long}. Select to view or change it.`);
    hc.innerHTML = `<span class="cb-dot">${I.check(18)}</span><span class="cb-long"><b>Callback booked</b><span class="cb-extra"> · ${HELP[cb.line][0]}</span> · ${day} ${short}</span><span class="cb-short"><b>Callback</b> ${day.toLowerCase()} ${short}</span>`;
  }
  $('#help-bar').innerHTML = helpBar();
  document.querySelectorAll('.cb-link').forEach(b => {
    const i = +b.dataset.line;
    b.classList.toggle('booked', !!(S.callback && S.callback.line === i));
    b.innerHTML = cbLabel(i);
  });
}
function cbChoose(i) {
  const [t, n, tel, d] = HELP[i];
  const other = S.callback && S.callback.line !== i
    ? `<div class="banner b-reminder-flat"><h3>You already have a callback booked</h3><p>The ${HELP[S.callback.line][0]} team will call you ${SLOTS[S.callback.slot][3]}. Booking this one will replace it.</p></div>` : '';
  return `${sheetHead(`${t} help line`)}
    <p>${d}</p>${other}
    <div class="opt">
      <h3>${I.phoneS(24)}Call now</h3>
      <p>Current wait time: <b>about ${WAIT[i]} minutes</b></p>
      <a class="btn btn-2" href="tel:${tel}">Call ${n}</a>
    </div>
    <div class="opt hi">
      <h3>${I.callIn(24)}Call me back</h3>
      <p>Skip the wait on hold. Choose a time and the ${t} team will call you.</p>
      <button class="btn btn-1" type="button" data-action="cb-slots" data-line="${i}">Choose a time</button>
    </div>`;
}
function cbSlots(i) {
  return `${sheetHead('When should we call you?')}
    <p>The ${HELP[i][0]} team will call your mobile: <b>${fmtMobile(S.account.mobile)}</b></p>
    <div class="slots" role="group" aria-label="Callback times">
      ${SLOTS.map(([day, time], k) => `<button class="slot" type="button" data-action="cb-pick" data-slot="${k}" aria-pressed="${pickedSlot === k}"><span><b>${day}</b>, ${time}</span>${I.check(26)}</button>`).join('')}
    </div>
    <p class="err" id="slot-err" role="alert"></p>
    <div class="stack-btns" style="margin-top:4px">
      <button class="btn btn-1" type="button" data-action="cb-book" data-line="${i}">Book my callback</button>
      <button class="btn btn-3" type="button" data-action="callback" data-line="${i}">Back</button>
    </div>`;
}
function cbBooked(i) {
  const k = S.callback.slot;
  return `<div class="badge-ok">${I.check(34)}</div>
    ${sheetHead('Callback booked')}
    <div class="banner b-complete"><h3>${SLOTS[k][0]}, ${SLOTS[k][1]}</h3><p>The ${HELP[i][0]} team will call <b>${fmtMobile(S.account.mobile)}</b> ${SLOTS[k][3]}.</p></div>
    <p style="margin-top:14px">You don’t need to keep this screen open. We’ve sent you a text message to confirm.</p>
    <div class="stack-btns">
      <button class="btn btn-1" type="button" data-action="sheet-close">Done</button>
      <button class="btn btn-2" type="button" data-action="cb-slots" data-line="${i}">Change the time</button>
      <button class="btn btn-3" type="button" data-action="cb-cancel" data-line="${i}">Cancel callback</button>
    </div>`;
}

function setHelp(toggle, open) {
  toggle.setAttribute('aria-expanded', open);
  toggle.nextElementSibling.hidden = !open;
  toggle.closest('.help').classList.toggle('open', open);
}
function closeHelp() {
  document.querySelectorAll('.help-toggle[aria-expanded="true"]').forEach(t => setHelp(t, false));
}
// Clicking anywhere outside an open help panel closes it
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('.help')) closeHelp();
  if (!e.target.closest('.ts')) closeTS();
  if (lap() && e.target !== document.documentElement) {   // tapping the scrollbar doesn't count
    if (!e.target.closest('.dd')) closeDDs();
    if (!e.target.closest('.pay-why, #why-pop')) setWhy(false);
  }
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'login-form') {
    const name = $('#name').value.trim().replace(/\s+/g, ' '), email = $('#email').value.trim();
    const fail = (msg, el) => { $('#login-err').textContent = msg; el.focus(); };
    if (!name) return fail('Please enter your name.', $('#name'));
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Please enter your email address, for example name@email.com', $('#email'));
    if (!$('#password').value) return fail('Please enter your password.', $('#password'));
    const full = name.replace(/(^|[\s'’-])(\p{L})/gu, (m, sep, ch) => sep + ch.toUpperCase());   // margaret o'brien → Margaret O'Brien
    S.user = { full, first: full.split(' ')[0] };
    S.account.email = email;
    $('#password').value = '';
    $('#view-login').hidden = true;
    $('#view-app').hidden = false;
    wireAssets($('#view-app'));
    try { history.replaceState({ screen: 'home' }, ''); } catch (e) {}
    go('home', false);
  }
  if (f.id === 'income-form') {
    const noPartner = $('#no-partner').checked;
    const you = clean($('#inc-you').value), partner = noPartner ? '0' : clean($('#inc-partner').value);
    if (!valid(you) || !valid(partner)) {
      $('#income-err').textContent = noPartner ? 'Please enter your income, even if it’s 0.' : 'Please enter an amount for both of you, even if it’s 0.';
      (valid(you) ? $('#inc-partner') : $('#inc-you')).focus();
      return;
    }
    S.draft.you = you; S.draft.partner = partner; S.draft.noPartner = noPartner;
    go('report-3');
  }
  if (f.id === 'assets-form') {
    const ids = ['as-savings', 'as-shares', 'as-other'], vals = ids.map(id => clean($('#' + id).value));
    const bad = vals.findIndex(v => !valid(v));
    if (bad > -1) { $('#assets-err').textContent = 'Please enter an amount for each, even if it’s 0.'; $('#' + ids[bad]).focus(); return; }
    S.draft.assets = { savings: vals[0], shares: vals[1], other: vals[2] };
    go('assets-3');
  }
  if (f.id === 'address-form') {
    const v = $('#new-addr').value.trim();
    if (!v) { $('#addr-err').textContent = 'Please enter your new address.'; $('#new-addr').focus(); return; }
    S.draft.addr = v;
    go('address-3');
  }
  if (f.id === 'reset-form') {
    const em = $('#reset-email').value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) { $('#reset-err').textContent = 'Please enter your email address, for example name@email.com'; $('#reset-email').focus(); return; }
    renderSheet(resetSent(em)); announce('Reset link sent.');
  }
  if (f.id === 'account-form') {
    const before = { ...S.account };
    S.account.mobile = $('#acc-mobile').value.trim() || S.account.mobile;
    S.account.email = $('#acc-email').value.trim() || S.account.email;
    S.account.address = $('#acc-address').value.trim() || S.account.address;
    const bank = !!$('#acc-bank').value.trim();
    if (bank) S.account.bank = '*************** *******-*********';
    S.saved = [['mobile', 'mobile number'], ['email', 'email'], ['address', 'address']].filter(([k]) => before[k] !== S.account[k]).map(([, l]) => l).concat(bank ? ['bank details'] : []);
    const changed = S.saved.length;
    go('account');
    if (lap()) announce(changed ? 'Your details have been updated.' : 'No changes were made.');
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'no-partner') {
    const inp = $('#inc-partner'); inp.disabled = e.target.checked; if (e.target.checked) inp.value = '';
    $('#income-err').textContent = '';
  }
  if (e.target.id === 'show-pw') $('#password').type = e.target.checked ? 'text' : 'password';
});
document.addEventListener('input', e => {
  if (e.target.closest('#login-form')) $('#login-err').textContent = '';
  if (e.target.closest('#income-form')) $('#income-err').textContent = '';
  if (e.target.closest('#assets-form')) $('#assets-err').textContent = '';
  if (e.target.id === 'new-addr') $('#addr-err').textContent = '';
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if ($('#ts-btn').getAttribute('aria-expanded') === 'true') { closeTS(); $('#ts-btn').focus(); return; }
  const why = $('.pay-why[aria-expanded="true"]');
  if (why) { setWhy(false); why.focus(); return; }
  const open = document.querySelector('.help-toggle[aria-expanded="true"]');
  if (open) { closeHelp(); open.focus(); }
});
$('#wordmark').addEventListener('click', () => go('home'));
$('#profile-btn').addEventListener('click', () => { if (!FLOW.includes(S.screen)) go('account'); });

$('#help-bar').innerHTML = helpBar();
$('#hh').innerHTML = headerHelp();
$('#login-help').innerHTML = loginHelp();
document.body.appendChild($('#sheet'));   // the pop-up sheet also works before logging in
refreshHelp();
try { const t = +localStorage.getItem(TS_KEY); if (t === 1 || t === 2) setTS(t, false); } catch (e) {}
wireAssets($('#view-login'));
})();
</script>
</body>
</html>
